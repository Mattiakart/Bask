<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 600" role="img" aria-label="Bask in Wardrobe">
  <!-- Official mark: perspective open door + Bodoni B + peeking cats -->
  <g fill="#15161a">
    <!-- Door thickness (outer left edge in perspective) -->
    <path d="M118 78 L42 128 V472 L118 522 Z"/>
    <!-- Upper bowl -->
    <path d="M248 60 H340 C414 60 450 110 450 170 C450 230 414 276 340 276 H248 V234 H328 C370 234 394 208 394 170 C394 132 370 104 328 104 H248 Z"/>
    <!-- Lower bowl -->
    <path d="M248 276 H352 C430 276 460 336 460 410 C460 496 412 540 340 540 H248 V498 H328 C386 498 408 460 408 410 C408 360 386 326 328 326 H248 Z"/>
    <!-- Spine -->
    <rect x="236" y="60" width="18" height="480"/>
  </g>
  <!-- Open door face in perspective (parallelogram) -->
  <path d="M118 78 L236 60 L236 540 L118 522 Z" fill="#ffffff"/>
  <path d="M118 78 L236 60 L236 540 L118 522 Z" fill="none" stroke="#15161a" stroke-width="6.5" stroke-linejoin="miter"/>
  <!-- Copper handle -->
  <rect x="154" y="278" width="9" height="38" rx="4.5" fill="#b0763f" transform="rotate(-1 158 297)"/>
  <!-- Peeking cats -->
  <g fill="#ffffff" stroke="#15161a" stroke-linejoin="round">
    <g transform="translate(128 448)">
      <path d="M0 52 V20 C0 11 2 5 9 -1 L4 -22 L22 -5 C26 -7 30 -8 35 -8 C40 -8 44 -7 48 -5 L66 -22 L61 -1 C68 5 70 11 70 20 V52 Z" stroke-width="4"/>
      <ellipse cx="25" cy="24" rx="6.2" ry="8.8" stroke-width="2.6"/>
      <ellipse cx="45" cy="24" rx="6.2" ry="8.8" stroke-width="2.6"/>
      <rect x="23.4" y="18" width="3.2" height="12" rx="1.6" fill="#15161a" stroke="none"/>
      <rect x="43.4" y="18" width="3.2" height="12" rx="1.6" fill="#15161a" stroke="none"/>
    </g>
    <g transform="translate(202 460)">
      <path d="M0 42 V16 C0 9 2 4 7 -1 L3 -18 L18 -4 C21 -5.5 24 -6.5 28 -6.5 C32 -6.5 35 -5.5 38 -4 L53 -18 L49 -1 C54 4 56 9 56 16 V42 Z" stroke-width="4"/>
      <ellipse cx="20" cy="18" rx="5.2" ry="7.4" stroke-width="2.4"/>
      <ellipse cx="36" cy="18" rx="5.2" ry="7.4" stroke-width="2.4"/>
      <rect x="18.6" y="13" width="2.8" height="10" rx="1.4" fill="#15161a" stroke="none"/>
      <rect x="34.6" y="13" width="2.8" height="10" rx="1.4" fill="#15161a" stroke="none"/>
    </g>
  </g>
</svg>
