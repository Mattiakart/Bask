name: Deploy static site

# Builds the marketing page as plain files and publishes them to GitHub Pages.
# The source tree is never served — that is what produces an "Index of /" listing.
#
# Optional: OVH hosting is the primary path (see publish-ovh-branches.yml).
# One-time Pages setup in the repo (admin required — Actions cannot enable this):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     NEXT_PUBLIC_SITE_URL          = https://your-domain (or https://user.github.io/Bask)
#     NEXT_PUBLIC_WAITLIST_ENDPOINT = https://formspree.io/f/xxxx   (required for the form)
#     NEXT_PUBLIC_BASE_PATH         = /Bask                         (only for project Pages)

on:
  push:
    branches: [cursor/source-2cf4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          # Empty repo vars become "" in Actions; fall back so metadataBase stays a valid URL.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ vars.NEXT_PUBLIC_WAITLIST_ENDPOINT }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build:static

      # Underscored folders like _next are ignored by Jekyll; this file opts out.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled — build succeeded, deploy skipped. Enable at Settings → Pages → Source: GitHub Actions (admin)."
          fi

  deploy:
    needs: [build, pages-status]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
